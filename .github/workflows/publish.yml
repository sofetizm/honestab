name: Publish to PyPI

# Runs when a release is published on GitHub. One-time setup on pypi.org:
# Account settings -> Publishing -> add a "pending publisher" for this repository
# with workflow name publish.yml and environment pypi.
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
